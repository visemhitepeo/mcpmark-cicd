name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: |
          set +e
          ESLINT_OUTPUT=$(npm run lint 2>&1)
          ESLINT_EXIT=$?
          echo "exit_code=$ESLINT_EXIT" >> $GITHUB_OUTPUT
          ESLINT_OUTPUT="${ESLINT_OUTPUT//'%'/'%25'}"
          ESLINT_OUTPUT="${ESLINT_OUTPUT//$'\n'/'%0A'}"
          ESLINT_OUTPUT="${ESLINT_OUTPUT//$'\r'/'%0D'}"
          echo "output=$ESLINT_OUTPUT" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Run Prettier check
        id: prettier
        run: |
          set +e
          PRETTIER_OUTPUT=$(npx prettier --check "src/**/*.js" 2>&1)
          PRETTIER_EXIT=$?
          echo "exit_code=$PRETTIER_EXIT" >> $GITHUB_OUTPUT
          PRETTIER_OUTPUT="${PRETTIER_OUTPUT//'%'/'%25'}"
          PRETTIER_OUTPUT="${PRETTIER_OUTPUT//$'\n'/'%0A'}"
          PRETTIER_OUTPUT="${PRETTIER_OUTPUT//$'\r'/'%0D'}"
          echo "output=$PRETTIER_OUTPUT" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Post Code Quality Report
        uses: actions/github-script@v7
        with:
          script: |
            const eslintExit = parseInt('${{ steps.eslint.outputs.exit_code }}', 10);
            const prettierExit = parseInt('${{ steps.prettier.outputs.exit_code }}', 10);
            const eslintOutput = `\`\`\`\n${'${{ steps.eslint.outputs.output }}'.slice(0, 2000)}\n\`\`\``;
            const prettierOutput = `\`\`\`\n${'${{ steps.prettier.outputs.output }}'.slice(0, 2000)}\n\`\`\``;

            const eslintStatus = eslintExit === 0 ? '✅ Passed' : '❌ Failed';
            const prettierStatus = prettierExit === 0 ? '✅ Passed' : '❌ Failed';
            const overallStatus = (eslintExit === 0 && prettierExit === 0) ? '✅ All checks passed' : '⚠️ Some checks failed';

            const body = `## Code Quality Report

            **Overall Status:** ${overallStatus}

            ### ESLint
            **Status:** ${eslintStatus}

            ${eslintOutput}

            ### Prettier
            **Status:** ${prettierStatus}

            ${prettierOutput}

            ---
            *Report generated by PR Automation workflow*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Code Quality Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if code quality checks failed
        if: steps.eslint.outputs.exit_code != 0 || steps.prettier.outputs.exit_code != 0
        run: exit 1

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: tests
        run: |
          set +e
          TEST_OUTPUT=$(npm test -- --coverage 2>&1)
          TEST_EXIT=$?
          echo "exit_code=$TEST_EXIT" >> $GITHUB_OUTPUT
          TEST_OUTPUT="${TEST_OUTPUT//'%'/'%25'}"
          TEST_OUTPUT="${TEST_OUTPUT//$'\n'/'%0A'}"
          TEST_OUTPUT="${TEST_OUTPUT//$'\r'/'%0D'}"
          echo "output=$TEST_OUTPUT" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Extract coverage summary
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "summary_exists=true" >> $GITHUB_OUTPUT
            COVERAGE_SUMMARY=$(cat coverage/coverage-summary.json)
            COVERAGE_SUMMARY="${COVERAGE_SUMMARY//'%'/'%25'}"
            COVERAGE_SUMMARY="${COVERAGE_SUMMARY//$'\n'/'%0A'}"
            COVERAGE_SUMMARY="${COVERAGE_SUMMARY//$'\r'/'%0D'}"
            echo "summary=$COVERAGE_SUMMARY" >> $GITHUB_OUTPUT
          else
            echo "summary_exists=false" >> $GITHUB_OUTPUT
            echo "summary=" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
        continue-on-error: true

      - name: Post Test Coverage Report
        uses: actions/github-script@v7
        with:
          script: |
            const testExit = parseInt('${{ steps.tests.outputs.exit_code }}', 10);
            const testOutput = `\`\`\`\n${'${{ steps.tests.outputs.output }}'.slice(0, 3000)}\n\`\`\``;
            const testStatus = testExit === 0 ? '✅ All tests passed' : '❌ Some tests failed';

            let coverageTable = '';
            const summaryExists = '${{ steps.coverage.outputs.summary_exists }}' === 'true';
            if (summaryExists) {
              try {
                const summary = JSON.parse('${{ steps.coverage.outputs.summary }}');
                const total = summary.total || {};
                coverageTable = `
            | Metric | Percentage |
            |--------|------------|
            | Statements | ${total.statements?.pct ?? 'N/A'}% |
            | Branches | ${total.branches?.pct ?? 'N/A'}% |
            | Functions | ${total.functions?.pct ?? 'N/A'}% |
            | Lines | ${total.lines?.pct ?? 'N/A'}% |
                `;
              } catch (e) {
                coverageTable = '_Could not parse coverage summary_';
              }
            } else {
              coverageTable = '_Coverage summary not available_';
            }

            const body = `## Test Coverage Report

            **Test Status:** ${testStatus}

            ### Coverage Summary
            ${coverageTable}

            ### Test Output
            ${testOutput}

            ---
            *Report generated by PR Automation workflow*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Test Coverage Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != 0
        run: exit 1

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          set +e
          AUDIT_OUTPUT=$(npm audit --audit-level=moderate 2>&1)
          AUDIT_EXIT=$?
          echo "exit_code=$AUDIT_EXIT" >> $GITHUB_OUTPUT
          AUDIT_OUTPUT="${AUDIT_OUTPUT//'%'/'%25'}"
          AUDIT_OUTPUT="${AUDIT_OUTPUT//$'\n'/'%0A'}"
          AUDIT_OUTPUT="${AUDIT_OUTPUT//$'\r'/'%0D'}"
          echo "output=$AUDIT_OUTPUT" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Scan for secrets in changed files
        id: secrets
        run: |
          set +e
          SECRETS_FOUND=0
          SECRETS_OUTPUT=""

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            SECRETS_OUTPUT="No changed files detected for secret scanning."
          else
            # Patterns to check for common secrets
            PATTERNS=(
              "AKIA[0-9A-Z]{16}"
              "AIza[0-9A-Za-z_-]{35}"
              "ghp_[0-9a-zA-Z]{36}"
              "gho_[0-9a-zA-Z]{36}"
              "ghu_[0-9a-zA-Z]{36}"
              "ghs_[0-9a-zA-Z]{36}"
              "-----BEGIN PRIVATE KEY-----"
              "password\s*[:=]\s*[\"'][^\"']+[\"']"
              "secret\s*[:=]\s*[\"'][^\"']+[\"']"
              "token\s*[:=]\s*[\"'][^\"']+[\"']"
              "api_key\s*[:=]\s*[\"'][^\"']+[\"']"
            )

            for file in $CHANGED_FILES; do
              if [ -f "$file" ]; then
                for pattern in "${PATTERNS[@]}"; do
                  MATCHES=$(grep -nE "$pattern" "$file" 2>/dev/null || true)
                  if [ -n "$MATCHES" ]; then
                    SECRETS_FOUND=1
                    SECRETS_OUTPUT="${SECRETS_OUTPUT}Potential secret found in $file:\n$MATCHES\n\n"
                  fi
                done
              fi
            done

            if [ "$SECRETS_FOUND" -eq 0 ]; then
              SECRETS_OUTPUT="No potential secrets detected in changed files."
            fi
          fi

          echo "exit_code=$SECRETS_FOUND" >> $GITHUB_OUTPUT
          SECRETS_OUTPUT="${SECRETS_OUTPUT//'%'/'%25'}"
          SECRETS_OUTPUT="${SECRETS_OUTPUT//$'\n'/'%0A'}"
          SECRETS_OUTPUT="${SECRETS_OUTPUT//$'\r'/'%0D'}"
          echo "output=$SECRETS_OUTPUT" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Post Security Scan Report
        uses: actions/github-script@v7
        with:
          script: |
            const auditExit = parseInt('${{ steps.audit.outputs.exit_code }}', 10);
            const secretsExit = parseInt('${{ steps.secrets.outputs.exit_code }}', 10);
            const auditOutput = `\`\`\`\n${'${{ steps.audit.outputs.output }}'.slice(0, 3000)}\n\`\`\``;
            const secretsOutput = `\`\`\`\n${'${{ steps.secrets.outputs.output }}'.slice(0, 2000)}\n\`\`\``;

            const auditStatus = auditExit === 0 ? '✅ No vulnerabilities found' : '⚠️ Vulnerabilities detected';
            const secretsStatus = secretsExit === 0 ? '✅ No secrets detected' : '⚠️ Potential secrets found';
            const overallStatus = (auditExit === 0 && secretsExit === 0) ? '✅ All security checks passed' : '⚠️ Security issues detected';

            const body = `## Security Scan Report

            **Overall Status:** ${overallStatus}

            ### Dependencies Vulnerabilities
            **Status:** ${auditStatus}

            ${auditOutput}

            ### Secrets Scan
            **Status:** ${secretsStatus}

            ${secretsOutput}

            ---
            *Report generated by PR Automation workflow*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Security Scan Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if critical security issues found
        if: steps.audit.outputs.exit_code != 0 || steps.secrets.outputs.exit_code != 0
        run: exit 1

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        id: build
        run: |
          set +e
          BUILD_OUTPUT=$(npm run build 2>&1)
          BUILD_EXIT=$?
          echo "exit_code=$BUILD_EXIT" >> $GITHUB_OUTPUT
          BUILD_OUTPUT="${BUILD_OUTPUT//'%'/'%25'}"
          BUILD_OUTPUT="${BUILD_OUTPUT//$'\n'/'%0A'}"
          BUILD_OUTPUT="${BUILD_OUTPUT//$'\r'/'%0D'}"
          echo "output=$BUILD_OUTPUT" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Start application and validate endpoints
        id: endpoints
        run: |
          set +e
          ENDPOINT_OUTPUT=""
          ENDPOINT_EXIT=0

          if [ "${{ steps.build.outputs.exit_code }}" -ne 0 ]; then
            ENDPOINT_OUTPUT="Build failed, skipping endpoint validation."
            ENDPOINT_EXIT=1
          else
            # Start the app in background
            npm start &
            APP_PID=$!
            sleep 3

            # Check health endpoint
            HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health 2>/dev/null || echo "000")
            if [ "$HEALTH_RESPONSE" = "200" ]; then
              ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT}✅ /health endpoint - accessible (status: $HEALTH_RESPONSE)\n"
            else
              ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT}❌ /health endpoint - not accessible (status: $HEALTH_RESPONSE)\n"
              ENDPOINT_EXIT=1
            fi

            # Check root endpoint
            ROOT_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")
            if [ "$ROOT_RESPONSE" = "200" ] || [ "$ROOT_RESPONSE" = "301" ] || [ "$ROOT_RESPONSE" = "302" ]; then
              ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT}✅ / endpoint - accessible (status: $ROOT_RESPONSE)\n"
            else
              ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT}⚠️ / endpoint - status: $ROOT_RESPONSE\n"
            fi

            # Check users endpoint
            USERS_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/users 2>/dev/null || echo "000")
            if [ "$USERS_RESPONSE" = "200" ]; then
              ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT}✅ /api/users endpoint - accessible (status: $USERS_RESPONSE)\n"
            else
              ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT}⚠️ /api/users endpoint - status: $USERS_RESPONSE\n"
            fi

            # Check calculator endpoint
            CALC_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/api/calculator/add?a=1&b=2" 2>/dev/null || echo "000")
            if [ "$CALC_RESPONSE" = "200" ]; then
              ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT}✅ /api/calculator/add endpoint - accessible (status: $CALC_RESPONSE)\n"
            else
              ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT}⚠️ /api/calculator/add endpoint - status: $CALC_RESPONSE\n"
            fi

            # Kill the app
            kill $APP_PID 2>/dev/null || true
            wait $APP_PID 2>/dev/null || true
          fi

          echo "exit_code=$ENDPOINT_EXIT" >> $GITHUB_OUTPUT
          ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT//'%'/'%25'}"
          ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT//$'\n'/'%0A'}"
          ENDPOINT_OUTPUT="${ENDPOINT_OUTPUT//$'\r'/'%0D'}"
          echo "output=$ENDPOINT_OUTPUT" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Create deployment preview artifacts
        run: |
          mkdir -p deployment-preview
          echo "Deployment Preview - PR #${{ github.event.pull_request.number }}" > deployment-preview/preview-info.txt
          echo "Branch: ${{ github.head_ref }}" >> deployment-preview/preview-info.txt
          echo "Commit: ${{ github.sha }}" >> deployment-preview/preview-info.txt
          echo "Build status: ${{ steps.build.outputs.exit_code == 0 && 'success' || 'failed' }}" >> deployment-preview/preview-info.txt
          echo "Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deployment-preview/preview-info.txt
          cp -r src deployment-preview/ 2>/dev/null || true
          cp package.json deployment-preview/ 2>/dev/null || true
        continue-on-error: true

      - name: Upload deployment preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: deployment-preview/
          if-no-files-found: warn
        continue-on-error: true

      - name: Post Build Validation status
        uses: actions/github-script@v7
        with:
          script: |
            const buildExit = parseInt('${{ steps.build.outputs.exit_code }}', 10);
            const endpointExit = parseInt('${{ steps.endpoints.outputs.exit_code }}', 10);
            const buildOutput = `\`\`\`\n${'${{ steps.build.outputs.output }}'.slice(0, 2000)}\n\`\`\``;
            const endpointOutput = '${{ steps.endpoints.outputs.output }}';

            const buildStatus = buildExit === 0 ? '✅ Build succeeded' : '❌ Build failed';
            const endpointStatus = endpointExit === 0 ? '✅ All endpoints validated' : '⚠️ Some endpoints failed validation';
            const overallStatus = (buildExit === 0 && endpointExit === 0) ? '✅ Build validation passed' : '⚠️ Build validation has issues';

            const body = `## Build Validation

            **Overall Status:** ${overallStatus}

            ### Build Status
            ${buildStatus}

            ${buildOutput}

            ### Endpoint Validation
            ${endpointStatus}

            ${endpointOutput}

            ### Deployment Preview
            Deployment preview artifacts have been uploaded.
            Artifact name: \`deployment-preview\`

            ---
            *Report generated by PR Automation workflow*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Build Validation')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if build validation failed
        if: steps.build.outputs.exit_code != 0 || steps.endpoints.outputs.exit_code != 0
        run: exit 1
